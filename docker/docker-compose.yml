version: "3.3"
networks:
  iam-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: ldap
    hostname: ldap.kerialis.local
    networks:
      iam-network:
        ipv4_address: 172.28.0.4
    environment:
      LDAP_ORGANISATION: "Kerialis"
      LDAP_DOMAIN: "kerialis.local"
      LDAP_ADMIN_PASSWORD: admin
      LDAP_CONFIG_PASSWORD: config
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
      LDAP_TLS: "false"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=kerialis,dc=local", "-D", "cn=admin,dc=kerialis,dc=local", "-w", "admin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=ldap,layer=data"
  
  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    hostname: phpldapadmin.kerialis.local
    networks:
      iam-network:
        ipv4_address: 172.28.0.5
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap.kerialis.local
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8090:80"
    depends_on:
      ldap:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=phpldapadmin,layer=management"
  
  midpoint_data:
    image: postgres:16-alpine
    environment:
     - POSTGRES_PASSWORD=db.secret.pw.007
     - POSTGRES_USER=midpoint
     - POSTGRES_INITDB_ARGS=--lc-collate=en_US.utf8 --lc-ctype=en_US.utf8
    command:
     - "postgres"
     - "-c"
     - "shared_buffers=256MB"
     - "-c"
     - "max_connections=200"
     - "-c"
     - "effective_cache_size=1GB"
     - "-c"
     - "maintenance_work_mem=64MB"
     - "-c"
     - "checkpoint_completion_target=0.9"
     - "-c"
     - "wal_buffers=16MB"
     - "-c"
     - "default_statistics_target=100"
     - "-c"
     - "random_page_cost=1.1"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      iam-network:
        ipv4_address: 172.28.0.10
    volumes:
     - midpoint_data:/var/lib/postgresql/data

  data_init:
    image: evolveum/midpoint:${MP_VER:-latest}-alpine
    command: >
      bash -c "
      cd /opt/midpoint ;
      bin/midpoint.sh init-native ;
      echo ' - - - - - - ' ;
      bin/ninja.sh -B info >/dev/null 2>/tmp/ninja.log ;
      grep -q \"ERROR\" /tmp/ninja.log && (
      bin/ninja.sh run-sql --create --mode REPOSITORY  ;
      bin/ninja.sh run-sql --create --mode AUDIT
      ) ||
      echo -e '\\n Repository init is not needed...' ;
      "
    depends_on:
     - midpoint_data
    environment:
     - MP_SET_midpoint_repository_jdbcUsername=midpoint
     - MP_SET_midpoint_repository_jdbcPassword=db.secret.pw.007
     - MP_SET_midpoint_repository_jdbcUrl=jdbc:postgresql://midpoint_data:5432/midpoint
     - MP_SET_midpoint_repository_database=postgresql
     - MP_INIT_CFG=/opt/midpoint/var
    networks:
      iam-network:
        ipv4_address: 172.28.0.12
    volumes:
     - midpoint_home:/opt/midpoint/var

  midpoint_server:
    image: evolveum/midpoint:${MP_VER:-latest}-alpine
    depends_on:
      data_init:
        condition: service_completed_successfully
      midpoint_data:
        condition: service_started
    command: [ "/opt/midpoint/bin/midpoint.sh", "container" ]
    ports:
      - 8080:8080
    environment:
     - MP_SET_midpoint_repository_jdbcUsername=midpoint
     - MP_SET_midpoint_repository_jdbcPassword=db.secret.pw.007
     - MP_SET_midpoint_repository_jdbcUrl=jdbc:postgresql://midpoint_data:5432/midpoint
     - MP_SET_midpoint_repository_database=postgresql
     - MP_SET_midpoint_administrator_initialPassword=Test5ecr3t
     - MP_UNSET_midpoint_repository_hibernateHbm2ddl=1
     - MP_NO_ENV_COMPAT=1
     # Optimisation Java
     - JAVA_OPTS=-Xms2048m -Xmx4096m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    networks:
      iam-network:
        ipv4_address: 172.28.0.20
    volumes:
     - midpoint_home:/opt/midpoint/var
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/midpoint/rest/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=midpoint,layer=application"
  
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    hostname: keycloak.kerialis.local
    networks:
      iam-network:
        ipv4_address: 172.28.0.21
    command: start-dev
    environment:
      # Admin Credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      
      # Database (dev mode uses H2, prod devrait utiliser PostgreSQL)
      KC_DB: dev-file
      
      # Hostname
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      
      # Java Options
      JAVA_OPTS_APPEND: "-Xms512m -Xmx1024m"
    ports:
      - "8081:8080"
    depends_on:
      ldap:
        condition: service_healthy
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=keycloak,layer=auth"
  vault:
      image: hashicorp/vault:latest
      container_name: vault
      hostname: vault.kerialis.local
      networks:
        iam-network:
          ipv4_address: 172.28.0.30
      environment:
        VAULT_DEV_ROOT_TOKEN_ID: root
        VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        VAULT_ADDR: http://0.0.0.0:8200
      ports:
        - "8200:8200"
      volumes:
        - vault_data:/vault/data
        - vault_logs:/vault/logs
      cap_add:
        - IPC_LOCK
      healthcheck:
        test: ["CMD", "vault", "status"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 30s
      restart: unless-stopped
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"
          labels: "service=vault,layer=secrets"
volumes:
  midpoint_data:
  midpoint_home:
  vault_data:
  vault_logs:
  ldap_data:
  ldap_config:
  keycloak_data:
