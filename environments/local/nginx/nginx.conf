events {
    worker_connections 1024;
}

http {
    upstream midpoint {
        server midpoint:8080;
    }

    upstream keycloak {
        server keycloak:8080;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream sirh {
        server sirh-api:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # MidPoint
        location /midpoint {
            proxy_pass http://midpoint;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Keycloak
        location /auth {
            proxy_pass http://keycloak/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /auth/;
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Path /grafana;
            proxy_redirect / /grafana/;
        }

        # SIRH API
        location /api/ {
            proxy_pass http://sirh/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenAPI schema redirect for Swagger UI
        location /openapi.json {
            proxy_pass http://sirh/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Page d'accueil
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }
    }
}
