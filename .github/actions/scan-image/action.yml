name: Image Vulnerability Scan
description: "Trivy image scan (CVE) + Dockle CIS benchmark (ANSSI) — SARIF + JSON artifacts"

inputs:
  image_uri:
    description: "Full image URI (name@sha256:...)"
    required: true
  severity:
    description: "Severity filter"
    default: "CRITICAL,HIGH"
  fail_on_vulnerability:
    description: "'true' to exit non-zero on findings"
    default: "true"
  dockle_ignore:
    description: "Comma-separated Dockle codes to ignore (ex: CIS-DI-0010)"
    default: ""

# Version Dockle épinglée — mettre à jour intentionnellement après validation
env:
  DOCKLE_VERSION: "0.4.14"

runs:
  using: composite
  steps:

    # ── Trivy — SARIF (onglet Security) ──────────────────────────
    - name: Trivy · image scan (SARIF)
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref:    ${{ inputs.image_uri }}
        format:       sarif
        output:       trivy-image.sarif
        severity:     ${{ inputs.severity }}
        exit-code:    ${{ inputs.fail_on_vulnerability == 'true' && '1' || '0' }}
        scanners:     vuln
        trivyignores: .trivyignore

    - name: Trivy · upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-image.sarif
        category:   trivy-image

    # ── Trivy — JSON artifact (rapport complet) ───────────────────
    - name: Trivy · image scan (JSON)
      if: always()
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref:    ${{ inputs.image_uri }}
        format:       json
        output:       trivy-image.json
        severity:     ${{ inputs.severity }}
        exit-code:    "0"
        scanners:     vuln

    - name: Trivy · upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name:           trivy-image-${{ github.run_id }}
        path:           trivy-image.json
        retention-days: 30

    # ── Dockle — CIS Docker Benchmark (ANSSI-PA-022) ─────────────
    - name: Dockle · CIS Docker Benchmark
      if: always()
      shell: bash
      env:
        DOCKLE_IGNORE:   ${{ inputs.dockle_ignore }}
        DOCKLE_VERSION:  "0.4.14"
        GH_TOKEN:        ${{ github.token }}
      run: |
        set -euo pipefail

        # Téléchargement de la version épinglée (authentifié pour éviter le rate-limit)
        curl -sSfL \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          "https://github.com/goodwithtech/dockle/releases/download/v${DOCKLE_VERSION}/dockle_${DOCKLE_VERSION}_Linux-64bit.tar.gz" \
          -o dockle.tar.gz

        tar -xzf dockle.tar.gz dockle
        chmod +x dockle
        rm dockle.tar.gz

        # Arguments d'ignore
        IGNORE_ARGS=""
        if [ -n "$DOCKLE_IGNORE" ]; then
          for code in $(echo "$DOCKLE_IGNORE" | tr ',' ' '); do
            IGNORE_ARGS="$IGNORE_ARGS --ignore $code"
          done
        fi

        # Rapport JSON pour artifact
        # shellcheck disable=SC2086
        ./dockle --format json --output dockle.json $IGNORE_ARGS \
          "${{ inputs.image_uri }}" 2>/dev/null || true

        # Affichage tabulaire + blocage si FATAL
        # shellcheck disable=SC2086
        ./dockle --format table $IGNORE_ARGS \
          --exit-level fatal \
          "${{ inputs.image_uri }}"

    - name: Dockle · upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name:           dockle-report-${{ github.run_id }}
        path:           dockle.json
        retention-days: 30
