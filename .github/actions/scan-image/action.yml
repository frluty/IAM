name: Image Vulnerability Scan
description: "Trivy image scan — SARIF to GitHub Security + JSON artifact"

inputs:
  image_uri:
    description: "Full image URI (name@sha256:...)"
    required: true
  severity:
    description: "Severity filter"
    default: "CRITICAL,HIGH"
  fail_on_vulnerability:
    description: "'true' to exit non-zero on findings"
    default: "true"

runs:
  using: composite
  steps:

    - name: Trivy · image scan (SARIF)
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref:    ${{ inputs.image_uri }}
        format:       sarif
        output:       trivy-image.sarif
        severity:     ${{ inputs.severity }}
        exit-code:    ${{ inputs.fail_on_vulnerability == 'true' && '1' || '0' }}
        scanners:     vuln,secret
        trivyignores: .trivyignore

    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-image.sarif
        category:   trivy-image

    - name: Trivy · image scan (JSON artifact)
      if: always()
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref:    ${{ inputs.image_uri }}
        format:       json
        output:       trivy-image.json
        severity:     ${{ inputs.severity }}
        exit-code:    "0"
        scanners:     vuln,secret

    - name: Upload report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name:           trivy-image-${{ github.run_id }}
        path:           trivy-image.json
        retention-days: 30
