name: Registry Login
description: "Authenticate to GHCR, ACR (SP or OIDC), or Harbor"

inputs:
  registry_type:
    description: "ghcr | acr | harbor"
    required: true
  registry_url:
    description: "Hostname — required for acr & harbor"
    default: ""
  username:
    description: "Harbor username or ACR Service Principal client ID"
    default: ""
  password:
    description: "Harbor password or ACR Service Principal client secret"
    default: ""
  azure_tenant_id:
    description: "Azure tenant ID (OIDC only)"
    default: ""
  azure_subscription_id:
    description: "Azure subscription ID (OIDC only)"
    default: ""

runs:
  using: composite
  steps:

    - name: Login · GHCR
      if: inputs.registry_type == 'ghcr'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Login · ACR (Service Principal)
      if: inputs.registry_type == 'acr' && inputs.password != ''
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry_url }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Login · Azure OIDC (Workload Identity)
      if: inputs.registry_type == 'acr' && inputs.password == ''
      uses: azure/login@v2
      with:
        client-id:       ${{ inputs.username }}
        tenant-id:       ${{ inputs.azure_tenant_id }}
        subscription-id: ${{ inputs.azure_subscription_id }}

    - name: Login · ACR token (OIDC)
      if: inputs.registry_type == 'acr' && inputs.password == ''
      shell: bash
      run: az acr login --name "${{ inputs.registry_url }}"

    - name: Login · Harbor
      if: inputs.registry_type == 'harbor'
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry_url }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
