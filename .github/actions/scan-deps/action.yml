name: Dependency Scan — Trivy FS (GHAS)
description: >
  Scan Trivy des lockfiles en CI (bloque les PRs avec vulnérabilités connues).
  L'audit de dépendances complet et les alertes Dependabot sont gérés
  automatiquement par GHAS via .github/dependabot.yml.
  Le secret scanning est géré nativement par GHAS (aucun scanner ici).

inputs:
  app_path:
    description: "Répertoire contenant les lockfiles"
    default: "."
  severity:
    description: "Filtre de sévérité Trivy"
    default: "CRITICAL,HIGH"
  fail_on_vulnerability:
    description: "'true' pour bloquer le pipeline sur findings"
    default: "true"

runs:
  using: composite
  steps:

    - name: Trivy · lockfile scan (vuln uniquement)
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type:    fs
        scan-ref:     ${{ inputs.app_path }}
        scanners:     vuln
        format:       sarif
        output:       trivy-fs.sarif
        severity:     ${{ inputs.severity }}
        exit-code:    ${{ inputs.fail_on_vulnerability == 'true' && '1' || '0' }}
        trivyignores: .trivyignore

    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-fs.sarif
        category:   trivy-deps
      continue-on-error: true
