name: Docker Image Metadata
description: "Calcule les tags et labels OCI de l'image."

inputs:
  image_name:
    description: "Nom de l'image en kebab-case (ex: mon-api)"
    required: true
  registry_prefix:
    description: "Préfixe registry (ex: ghcr.io/monorg)"
    required: true
  language:
    description: "python | node"
    default: ""

outputs:
  tags:
    description: "Tags Docker calculés"
    value: ${{ steps.meta.outputs.tags }}
  labels:
    description: "Labels OCI calculés"
    value: ${{ steps.meta.outputs.labels }}
  image_base:
    description: "Nom d'image sans tag (registry/image)"
    value: ${{ steps.image-base.outputs.value }}

runs:
  using: composite
  steps:

    - name: Compute image base name
      id: image-base
      shell: bash
      run: |
        echo "value=${{ inputs.registry_prefix }}/${{ inputs.image_name }}" >> "$GITHUB_OUTPUT"

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.image-base.outputs.value }}
        flavor: |
          latest=false
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}},enable=${{ !contains(github.ref, '-') }}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          type=sha,prefix=sha-,format=short
          type=ref,event=branch
          type=ref,event=pr,prefix=pr-
        labels: |
          org.opencontainers.image.title=${{ inputs.image_name }}
          org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.vendor=${{ github.repository_owner }}
          com.company.language=${{ inputs.language }}
          com.company.repo=${{ github.repository }}
