# ============================================================
#  Utility — Generate Cosign key pair
#
#  Run ONCE manually to bootstrap key-pair signing.
#  The private key is displayed in the run log — copy it
#  immediately into the COSIGN_PRIVATE_KEY repository secret.
#  The public key is uploaded as an artifact for verification.
#
#  After generation, disable this workflow (or delete it).
# ============================================================
name: "[Utility] Generate Cosign Key Pair"

on:
  workflow_dispatch:

jobs:
  generate-keypair:
    name: Generate Cosign Key Pair
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate key pair
        env:
          COSIGN_PASSWORD: ""   # set a passphrase here or leave empty
        run: |
          cosign generate-key-pair
          echo ""
          echo "======================================================"
          echo "  PRIVATE KEY — copy to secret COSIGN_PRIVATE_KEY"
          echo "======================================================"
          cat cosign.key
          echo "======================================================"

      - name: Upload public key
        uses: actions/upload-artifact@v4
        with:
          name: cosign-public-key
          path: cosign.pub
          retention-days: 7
