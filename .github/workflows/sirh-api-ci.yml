name: CI — SIRH API (Python)

on:
  push:
    branches: [main, develop]
    paths: ["services/sirh-api/**", ".github/workflows/sirh-api-ci.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["services/sirh-api/**"]
  workflow_dispatch:

jobs:
  pipeline:
    uses: ./.github/workflows/reusable-security.yml
    permissions:
      contents:        read
      packages:        write
      security-events: write
      id-token:        write
      attestations:    write
    with:
      language:              python
      app_path:              services/sirh-api
      image_name:            sirh-api
      dockerfile:            services/sirh-api/Dockerfile
      context:               services/sirh-api
      registry_type:         ghcr
      enable_signing:        ${{ github.event_name != 'pull_request' }}
      signing_mode:          keyless
      severity:              CRITICAL,HIGH
      fail_on_vulnerability: true
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
