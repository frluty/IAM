name: CI — Node Service (example)

on:
  push:
    branches: [main, develop]
    paths: ["services/<service-name>/**"]
  pull_request:
    branches: [main, develop]
    paths: ["services/<service-name>/**"]
  workflow_dispatch:

jobs:
  pipeline:
    uses: ./.github/workflows/reusable-security.yml
    permissions:
      contents:        read
      packages:        write
      security-events: write
      id-token:        write
      attestations:    write
    with:
      language:              node
      app_path:              services/<service-name>
      image_name:            <service-name>
      dockerfile:            services/<service-name>/Dockerfile
      context:               services/<service-name>
      registry_type:         ghcr
      # registry_url:        myacr.azurecr.io
      enable_signing:        ${{ github.event_name != 'pull_request' }}
      signing_mode:          keyless
      severity:              CRITICAL,HIGH
      fail_on_vulnerability: true
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
