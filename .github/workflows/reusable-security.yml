# ================================================================
#  Reusable Security Pipeline — orchestrator
#
#  Chaque job délègue à une composite action dédiée :
#    detect         →  .github/actions/detect-language
#    harden         →  .github/actions/harden-dockerfile      (ANSSI-PA-022)
#    code-scan      →  .github/actions/scan-code              (CodeQL — GHAS)
#    dep-scan       →  .github/actions/scan-deps              (Trivy FS)
#    build-push     →  registry-login-{ghcr|acr|harbor} + docker/build-push-action
#    image-scan     →  .github/actions/scan-image             (Trivy CVE + Dockle CIS)
#    sign           →  .github/actions/sign-image             (Cosign)
#
#  GHAS natif (hors pipeline) :
#    Secret scanning   →  activé au niveau org/repo (Settings → Security)
#    Dependabot alerts →  configuré via .github/dependabot.yml dans chaque repo projet
# ================================================================
name: Reusable — Security Pipeline

on:
  workflow_call:
    inputs:
      language:
        description: "python | node | auto"
        default:  "auto"
        type: string
      app_path:
        description: "Répertoire source (là où se trouvent les lockfiles)"
        default:  "."
        type: string
      image_name:
        description: "Nom de l'image (ex: sirh-api)"
        required: true
        type: string
      dockerfile:
        default:  "Dockerfile"
        type: string
      context:
        default:  "."
        type: string
      build_args:
        default:  ""
        type: string
      platforms:
        default:  "linux/amd64"
        type: string
      extra_tags:
        default:  ""
        type: string
      service_description:
        description: "Description courte du service — label OCI image.description"
        default:  ""
        type: string

      # ── Registry ─────────────────────────────────────────────
      registry_type:
        description: "ghcr | acr | harbor"
        required: true
        type: string
      registry_url:
        description: "Hostname du registre (requis pour acr et harbor)"
        default:  ""
        type: string
      registry_namespace:
        description: "Namespace / projet dans le registre"
        default:  ""
        type: string

      # ── Contrôles du pipeline ─────────────────────────────────
      enable_code_scan:
        default:  true
        type: boolean
      enable_dep_scan:
        default:  true
        type: boolean
      enable_hardening:
        description: "Contrôles de durcissement ANSSI-PA-022"
        default:  true
        type: boolean
      enable_image_scan:
        default:  true
        type: boolean
      enable_signing:
        default:  true
        type: boolean
      signing_mode:
        description: "keyless (Sigstore OIDC) | keypair"
        default:  "keyless"
        type: string
      severity:
        default:  "CRITICAL,HIGH"
        type: string
      fail_on_vulnerability:
        default:  true
        type: boolean
      hadolint_ignore:
        description: "Règles Hadolint à ignorer (ex: DL3008,DL3009)"
        default:  ""
        type: string
      dockle_ignore:
        description: "Codes Dockle à ignorer (ex: CIS-DI-0010)"
        default:  ""
        type: string
      harden_fail_on_warning:
        description: "'true' pour bloquer sur les avertissements ANSSI"
        default:  "false"
        type: string

    secrets:
      # ── ACR ──────────────────────────────────────────────────
      AZURE_CLIENT_ID:        { required: false }
      AZURE_CLIENT_SECRET:    { required: false }   # vide = OIDC Workload Identity
      AZURE_TENANT_ID:        { required: false }
      AZURE_SUBSCRIPTION_ID:  { required: false }
      # ── Harbor ───────────────────────────────────────────────
      HARBOR_USERNAME:        { required: false }
      HARBOR_PASSWORD:        { required: false }
      # ── Cosign key-pair ───────────────────────────────────────
      COSIGN_PRIVATE_KEY:     { required: false }
      COSIGN_PASSWORD:        { required: false }

    outputs:
      image_digest:
        value: ${{ jobs.build-push.outputs.digest }}
      image_uri:
        value: ${{ jobs.build-push.outputs.image_uri }}
      image_tags:
        value: ${{ jobs.build-push.outputs.tags }}
      language:
        value: ${{ jobs.detect.outputs.language }}

# Un seul run actif par branche/PR — annule les runs obsolètes
concurrency:
  group: security-pipeline-${{ github.ref }}
  cancel-in-progress: true

# ================================================================
jobs:

  # ── 1. Détection du langage ───────────────────────────────────
  detect:
    name: Detect Language
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      language: ${{ steps.action.outputs.language }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/detect-language
        id: action
        with:
          language: ${{ inputs.language }}
          app_path: ${{ inputs.app_path }}

  # ── 2. Hardening Dockerfile ANSSI-PA-022 (pré-build) ─────────
  harden:
    name: Hardening ANSSI · Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect
    if: inputs.enable_hardening
    permissions:
      contents:        read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/harden-dockerfile
        with:
          dockerfile:      ${{ inputs.dockerfile }}
          hadolint_ignore: ${{ inputs.hadolint_ignore }}
          fail_on_warning: ${{ inputs.harden_fail_on_warning }}

  # ── 3. SAST CodeQL — GHAS (parallèle) ────────────────────────
  code-scan:
    name: "CodeQL · ${{ needs.detect.outputs.language }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60   # CodeQL peut être lent sur de grandes bases de code
    needs: detect
    if: inputs.enable_code_scan
    permissions:
      actions:         read
      contents:        read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/scan-code
        with:
          language: ${{ needs.detect.outputs.language }}

  # ── 4. Scan dépendances — Trivy FS gate CI (parallèle) ───────
  dep-scan:
    name: Deps · Trivy FS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect
    if: inputs.enable_dep_scan
    permissions:
      contents:        read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/scan-deps
        with:
          app_path:              ${{ inputs.app_path }}
          severity:              ${{ inputs.severity }}
          fail_on_vulnerability: ${{ inputs.fail_on_vulnerability && 'true' || 'false' }}

  # ── 5. Build & push ───────────────────────────────────────────
  build-push:
    name: "Build & Push · ${{ inputs.registry_type }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect, harden, code-scan, dep-scan]
    if: |
      always() &&
      (needs.harden.result    == 'success' || needs.harden.result    == 'skipped') &&
      (needs.code-scan.result == 'success' || needs.code-scan.result == 'skipped') &&
      (needs.dep-scan.result  == 'success' || needs.dep-scan.result  == 'skipped')
    permissions:
      contents:     read
      packages:     write
      id-token:     write
      attestations: write
    outputs:
      digest:    ${{ steps.push.outputs.digest }}
      image_uri: ${{ steps.uri.outputs.value }}
      tags:      ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # ── Login selon le registry ───────────────────────────────
      - uses: ./.github/actions/registry-login-ghcr
        if: inputs.registry_type == 'ghcr'

      - uses: ./.github/actions/registry-login-acr
        if: inputs.registry_type == 'acr'
        with:
          registry_url:    ${{ inputs.registry_url }}
          client_id:       ${{ secrets.AZURE_CLIENT_ID }}
          client_secret:   ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant_id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: ./.github/actions/registry-login-harbor
        if: inputs.registry_type == 'harbor'
        with:
          registry_url: ${{ inputs.registry_url }}
          username:     ${{ secrets.HARBOR_USERNAME }}
          password:     ${{ secrets.HARBOR_PASSWORD }}

      # ── Préfixe registry ──────────────────────────────────────
      - name: Compute registry prefix
        id: reg
        shell: bash
        run: |
          NS="${{ inputs.registry_namespace }}"
          NS="${NS:+/$NS}"
          case "${{ inputs.registry_type }}" in
            ghcr)       echo "prefix=ghcr.io/${{ github.repository_owner }}${NS}" >> "$GITHUB_OUTPUT" ;;
            acr|harbor) echo "prefix=${{ inputs.registry_url }}${NS}"             >> "$GITHUB_OUTPUT" ;;
          esac

      # ── Tags et labels OCI ────────────────────────────────────
      - uses: ./.github/actions/docker-metadata
        id: meta
        with:
          image_name:          ${{ inputs.image_name }}
          registry_prefix:     ${{ steps.reg.outputs.prefix }}
          language:            ${{ needs.detect.outputs.language }}
          service_description: ${{ inputs.service_description }}
          extra_tags:          ${{ inputs.extra_tags }}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context:    ${{ inputs.context }}
          file:       ${{ inputs.dockerfile }}
          platforms:  ${{ inputs.platforms }}
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          provenance: true
          sbom:       true

      - name: Compute image URI
        id: uri
        shell: bash
        run: |
          echo "value=${{ steps.meta.outputs.image_base }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v1
        with:
          subject-name:     ${{ steps.meta.outputs.image_base }}
          subject-digest:   ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ── 6. Scan image — Trivy CVE + Dockle CIS ───────────────────
  image-scan:
    name: Image Scan · Trivy + Dockle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-push
    if: inputs.enable_image_scan && needs.build-push.result == 'success'
    permissions:
      contents:        read
      security-events: write
      packages:        read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/registry-login-ghcr
        if: inputs.registry_type == 'ghcr'

      - uses: ./.github/actions/registry-login-acr
        if: inputs.registry_type == 'acr'
        with:
          registry_url:    ${{ inputs.registry_url }}
          client_id:       ${{ secrets.AZURE_CLIENT_ID }}
          client_secret:   ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant_id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: ./.github/actions/registry-login-harbor
        if: inputs.registry_type == 'harbor'
        with:
          registry_url: ${{ inputs.registry_url }}
          username:     ${{ secrets.HARBOR_USERNAME }}
          password:     ${{ secrets.HARBOR_PASSWORD }}

      - uses: ./.github/actions/scan-image
        with:
          image_uri:             ${{ needs.build-push.outputs.image_uri }}
          severity:              ${{ inputs.severity }}
          fail_on_vulnerability: ${{ inputs.fail_on_vulnerability && 'true' || 'false' }}
          dockle_ignore:         ${{ inputs.dockle_ignore }}

  # ── 7. Signature Cosign ───────────────────────────────────────
  sign:
    name: "Sign · ${{ inputs.signing_mode }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect, build-push, image-scan]
    if: |
      inputs.enable_signing &&
      needs.build-push.result == 'success' &&
      (needs.image-scan.result == 'success' || needs.image-scan.result == 'skipped')
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/registry-login-ghcr
        if: inputs.registry_type == 'ghcr'

      - uses: ./.github/actions/registry-login-acr
        if: inputs.registry_type == 'acr'
        with:
          registry_url:    ${{ inputs.registry_url }}
          client_id:       ${{ secrets.AZURE_CLIENT_ID }}
          client_secret:   ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant_id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: ./.github/actions/registry-login-harbor
        if: inputs.registry_type == 'harbor'
        with:
          registry_url: ${{ inputs.registry_url }}
          username:     ${{ secrets.HARBOR_USERNAME }}
          password:     ${{ secrets.HARBOR_PASSWORD }}

      - uses: ./.github/actions/sign-image
        with:
          image_uri:          ${{ needs.build-push.outputs.image_uri }}
          signing_mode:       ${{ inputs.signing_mode }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign_password:    ${{ secrets.COSIGN_PASSWORD }}
          language:           ${{ needs.detect.outputs.language }}
