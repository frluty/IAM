global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'iam-local'
    environment: 'development'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # SIRH API
  - job_name: 'sirh-api'
    static_configs:
      - targets: ['sirh-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Keycloak metrics
  - job_name: 'keycloak'
    static_configs:
      - targets: ['keycloak:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # PostgreSQL exporter (si configuré)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis exporter (si configuré)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
