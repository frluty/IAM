global:
  resolve_timeout: 5m
  smtp_from: 'alertmanager@kerialis.local'
  smtp_smarthost: 'localhost:25'
  smtp_require_tls: false

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alerts
route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m
    
    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 1h
    
    # IAM specific alerts
    - match:
        component: iam
      receiver: 'iam-team'
      group_by: ['alertname', 'service']

# Receivers (notification endpoints)
receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true

  - name: 'critical-alerts'
    # Email notifications for critical alerts
    # Uncomment and configure when email is available
    # email_configs:
    #   - to: 'oncall@kerialis.local'
    #     headers:
    #       Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
    
    # Webhook for integration with other systems
    webhook_configs:
      - url: 'http://localhost:5001/critical'
        send_resolved: true

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/warning'
        send_resolved: true

  - name: 'iam-team'
    webhook_configs:
      - url: 'http://localhost:5001/iam'
        send_resolved: true

# Inhibition rules - suppress alerts when related critical alert is firing
inhibit_rules:
  # Inhibit warning if critical is firing for same instance
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['instance', 'alertname']
  
  # Don't alert on service down if entire node is down
  - source_match:
      alertname: 'NodeDown'
    target_match_re:
      alertname: '.*ServiceDown'
    equal: ['instance']
