# ================================================================
#  Template — Python service CI  (GHAS : CodeQL + Dependabot + Secret Scanning)
#
#  Prérequis repo projet :
#    1. GHAS activé (Settings → Security → GitHub Advanced Security)
#    2. Secret scanning activé (Settings → Security → Secret scanning)
#    3. .github/dependabot.yml configuré (copier templates/dependabot.yml)
#
#  Copier ce fichier : .github/workflows/ci.yml
#  Remplacer les valeurs entre < >
# ================================================================
name: CI — <service-name>

on:
  push:
    branches: [main, develop]
    paths:
      - "<chemin-service>/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths: ["<chemin-service>/**"]
  workflow_dispatch:

jobs:
  pipeline:
    uses: frluty/pipeline-security/.github/workflows/reusable-security.yml@v1
    permissions:
      actions:         read   # CodeQL
      contents:        read
      packages:        write
      security-events: write
      id-token:        write
      attestations:    write
    with:
      language:   python
      app_path:   <chemin-service>
      image_name: <service-name>
      dockerfile: <chemin-service>/Dockerfile
      context:    <chemin-service>

      # ── Registry — décommenter UN bloc ──────────────────

      # GHCR (aucun secret requis)
      registry_type: ghcr

      # ACR — Service Principal
      # registry_type: acr
      # registry_url:  <nom>.azurecr.io

      # ACR — Workload Identity (OIDC, sans secret)
      # registry_type: acr
      # registry_url:  <nom>.azurecr.io

      # Harbor on-premise
      # registry_type: harbor
      # registry_url:  harbor.<domaine>

      # ── Contrôles ────────────────────────────────────────
      enable_signing:        ${{ github.event_name != 'pull_request' }}
      signing_mode:          keyless
      severity:              CRITICAL,HIGH
      fail_on_vulnerability: true

    secrets:
      # ACR Service Principal
      # AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
      # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}

      # ACR Workload Identity (OIDC)
      # AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      # AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      # AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Harbor
      # HARBOR_USERNAME: ${{ secrets.HARBOR_USER }}
      # HARBOR_PASSWORD: ${{ secrets.HARBOR_TOKEN }}

      # Cosign key-pair (si signing_mode: keypair)
      # COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      # COSIGN_PASSWORD:    ${{ secrets.COSIGN_PASSWORD }}
