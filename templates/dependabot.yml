# ================================================================
#  Dependabot — GHAS
#
#  Copier dans le repo projet : .github/dependabot.yml
#  Décommenter les blocs correspondant aux écosystèmes utilisés.
#  Dependabot crée des PRs automatiques et alimente les alertes GHAS.
# ================================================================
version: 2

updates:

  # ── GitHub Actions ────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(actions)"

